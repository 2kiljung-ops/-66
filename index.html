<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Sales AI | 철강 영업 자동화</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f6fa;--panel:#fff;--ink:#172334;--muted:#68778b;--line:#e3e9f0;--blue:#1c5d99;--nav:#12263a;--green:#18794e;--amber:#a65d03;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;color:var(--ink)}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:hover{filter:brightness(.97)}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.sidebar{background:var(--nav);color:#fff;padding:22px 14px}.brand{font-size:20px;font-weight:800;padding:0 10px 8px}.brand small{display:block;color:#aebfd0;font-size:11px;font-weight:500;margin-top:6px}.nav{margin-top:24px;display:grid;gap:5px}.nav button{background:transparent;color:#c7d4e1;border:0;text-align:left;padding:12px}.nav button.active,.nav button:hover{background:#23415d;color:white}.side-note{font-size:11px;line-height:1.6;color:#aebfd0;margin:28px 10px}.main{min-width:0;padding:26px;max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.1em}.title{font-size:27px;font-weight:800;margin:5px 0}.subtitle{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.metric-label{font-size:12px;color:var(--muted)}.metric{font-size:27px;font-weight:800;margin:10px 0 5px}.metric-foot{font-size:11px;color:var(--muted)}.section{margin-top:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-head h2{font-size:16px;margin:0}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.list{display:grid;gap:0}.item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:5px;flex:none}.item strong{font-size:13px}.item p{font-size:12px;color:var(--muted);margin:5px 0 0;line-height:1.5}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:700;background:#edf4fb;color:var(--blue)}.pill.warn{background:#fff4df;color:var(--amber)}.pill.good{background:#e9f7ef;color:var(--green)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;color:#58687b;font-weight:700}tr:last-child td{border-bottom:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:white;min-width:0}.toolbar input{flex:1;min-width:180px}.field{display:grid;gap:6px;font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;color:var(--ink)}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.notice{background:#fff8e8;border:1px solid #f2d69d;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.6;color:#79500b}.muted{color:var(--muted)}.hidden{display:none!important}.barline{height:8px;background:#edf1f5;border-radius:20px;overflow:hidden;margin-top:8px}.barline span{display:block;height:100%;background:var(--blue);width:0}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.footer{font-size:11px;color:var(--muted);margin-top:18px;line-height:1.6}.modal{position:fixed;inset:0;background:#10203380;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{background:white;border-radius:15px;padding:22px;width:min(680px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font-size:18px;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.result{background:#f5f8fc;border-radius:10px;padding:15px;margin-top:14px}.result b{font-size:20px}.small{font-size:11px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button.active{background:#e8f1fa;border-color:#b7d2ed;color:var(--blue)}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px}.brand{padding-bottom:5px}.nav{display:flex;overflow:auto;margin-top:10px}.nav button{white-space:nowrap}.side-note{display:none}.main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}.title{font-size:23px}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.metric{font-size:22px}.top{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">STEEL SALES AI<small>철강 영업 자동화 에이전트 · MVP</small></div><div class="nav" id="nav"><button class="active" data-page="dashboard">▦　통합 대시보드</button><button data-page="customers">♙　거래처 관리</button><button data-page="pipeline">◎　영업 파이프라인</button><button data-page="quotes">₩　견적·마진 계산</button><button data-page="briefing">▤　시황·AI 브리핑</button><button data-page="settings">⚙　데이터 가져오기</button></div><div class="side-note">초기 MVP · 데이터는 현재 브라우저에 저장됩니다.<br>공유·다중 사용자·실시간 시황 연동은 별도 구축 단계입니다.</div></aside><main class="main"><div class="top"><div><div class="eyebrow">STEEL SALES WORKSPACE</div><div class="title" id="pageTitle">통합 대시보드</div><div class="subtitle" id="pageSub">고객·견적·수주 기회를 한 곳에서 관리합니다.</div></div><div class="actions"><button onclick="document.getElementById('excelInput').click()">엑셀 가져오기</button><button class="primary" onclick="openOpportunity()">+ 영업기회 등록</button></div></div><input id="excelInput" type="file" accept=".xlsx,.xls,.csv" hidden onchange="importFile(event)"><div id="content"></div><div class="footer">주의: 화면의 목표 수치는 기존 판매목표 파일을 바탕으로 한 초기 기준이며, 고객/매출 실적은 엑셀을 가져와야 반영됩니다. AI 추천은 의사결정 보조이며 가격 확정·견적 발송·고객 연락은 담당자 승인 후 진행해야 합니다.</div></main></div><div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s); const won=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Number(n)||0); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={customers:[],pipeline:[],quotes:[],settings:{annualTarget:3000000000,gpTarget:0.08,newCustomerTarget:20,projectTarget:12}};
let db;try{db=JSON.parse(localStorage.getItem('steelSalesAI')||'null')||seed}catch(e){db=seed} function save(){localStorage.setItem('steelSalesAI',JSON.stringify(db));}
const pageMeta={dashboard:['통합 대시보드','고객·견적·수주 기회를 한 곳에서 관리합니다.'],customers:['거래처 관리','엑셀 고객 명단을 검색하고 영업 우선순위를 관리합니다.'],pipeline:['영업 파이프라인','잠재 고객과 프로젝트의 진행 단계를 추적합니다.'],quotes:['견적·마진 계산','원가 구성과 목표 마진을 입력해 견적 기준을 계산합니다.'],briefing:['시황·AI 브리핑','시황 자료를 요약하고 오늘의 영업 행동으로 연결합니다.'],settings:['데이터 가져오기','거래처·판매 실적 파일을 불러오고 데이터를 내보냅니다.']};let current='dashboard';
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;current=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
function render(){ $('#pageTitle').textContent=pageMeta[current][0];$('#pageSub').textContent=pageMeta[current][1]; const root=$('#content'); root.innerHTML=({dashboard:dashboardHTML,customers:customersHTML,pipeline:pipelineHTML,quotes:quotesHTML,briefing:briefingHTML,settings:settingsHTML})[current](); if(current==='customers') renderCustomerTable();if(current==='pipeline')renderPipelineTable();if(current==='dashboard')renderDashboardExtras(); }
function dashboardHTML(){const active=db.pipeline.filter(x=>!['수주','실패'].includes(x.stage));const value=active.reduce((s,x)=>s+(+x.amount||0),0);const wonValue=db.pipeline.filter(x=>x.stage==='수주').reduce((s,x)=>s+(+x.amount||0),0);return `<div class="grid"><div class="card"><div class="metric-label">등록 거래처</div><div class="metric">${won(db.customers.length)}<span class="small muted"> 개</span></div><div class="metric-foot">엑셀 가져오기로 고객 DB 구성</div></div><div class="card"><div class="metric-label">진행 중 영업기회</div><div class="metric">${won(active.length)}<span class="small muted"> 건</span></div><div class="metric-foot">수주 가능성 추적 대상</div></div><div class="card"><div class="metric-label">파이프라인 예상 금액</div><div class="metric">${won(value/100000000*10)/10}<span class="small muted"> 억원</span></div><div class="metric-foot">진행 단계의 금액 합계</div></div><div class="card"><div class="metric-label">누적 수주 금액</div><div class="metric">${won(wonValue/100000000*10)/10}<span class="small muted"> 억원</span></div><div class="metric-foot">수주로 표시한 기회 합계</div></div></div><div class="two section"><div class="card"><div class="section-head"><h2>오늘의 AI 영업 추천</h2><span class="pill">규칙 기반 초안</span></div><div class="list"><div class="item"><span class="dot"></span><div><strong>거래처 데이터 품질부터 확보</strong><p>사업자 상태가 미확인인 거래처는 공식 확인 전까지 영업 대상 확정으로 처리하지 마세요. 거래처 엑셀을 가져온 뒤 업종·지역·품목 기준으로 우선순위를 붙이는 것이 첫 과제입니다.</p></div></div><div class="item"><span class="dot" style="background:#b7791f"></span><div><strong>견적 후속조치 누락 방지</strong><p>파이프라인에 다음 연락일을 기록하고, 예정일이 지난 기회를 먼저 점검하세요.</p></div></div><div class="item"><span class="dot" style="background:#18794e"></span><div><strong>수익성 중심으로 수주 판단</strong><p>판매량뿐 아니라 원가·가공·운송·금융비용을 포함한 예상 매출총이익을 확인하세요.</p></div></div></div></div><div class="card"><div class="section-head"><h2>2027년 판매 기준</h2><span class="pill warn">목표 기준</span></div><div class="metric">30억원</div><div class="metric-foot">연간 매출 목표 · 기존 목표관리표 기준</div><div style="margin-top:18px;display:flex;justify-content:space-between;font-size:12px"><span>목표 매출총이익률</span><b>8%</b></div><div class="barline"><span style="width:8%"></span></div><div style="margin-top:16px;display:flex;justify-content:space-between;font-size:12px"><span>신규 우량 고객 목표</span><b>20개</b></div><div style="margin-top:16px;display:flex;justify-content:space-between;font-size:12px"><span>프로젝트 목표</span><b>12건</b></div><p class="small muted" style="margin-top:20px">실적 자동 집계는 판매 실적 파일을 가져온 후 연결할 수 있습니다.</p></div></div><div class="section card"><div class="section-head"><h2>최근 영업기회</h2><button onclick="current='pipeline';render()">전체 보기 →</button></div><div id="dashPipeline"></div></div>`}
function renderDashboardExtras(){const el=$('#dashPipeline');if(!db.pipeline.length){el.innerHTML='<div class="empty">아직 등록된 영업기회가 없습니다. “영업기회 등록”으로 첫 기회를 추가하거나 판매 자료를 가져오세요.</div>';return}el.innerHTML=pipelineRows(db.pipeline.slice(-5).reverse())}
function customersHTML(){return `<div class="card"><div class="toolbar"><input id="customerSearch" placeholder="거래처명·업종·지역·전화번호 검색" oninput="renderCustomerTable()"><select id="customerStatus" onchange="renderCustomerTable()"><option value="">모든 검증 상태</option><option>미확인</option><option>확인 필요</option><option>정상</option><option>폐업</option></select><button onclick="exportCustomers()">거래처 CSV 내보내기</button><button class="primary" onclick="openCustomer()">+ 거래처 등록</button></div><div id="customerTable"></div></div>`}
function renderCustomerTable(){const el=$('#customerTable');if(!el)return;const q=($('#customerSearch')?.value||'').toLowerCase(),st=$('#customerStatus')?.value||'';const filtered=db.customers.filter(c=>Object.values(c).join(' ').toLowerCase().includes(q)&&(!st||String(c.status||c['사업자상태']||'').includes(st)));const rows=filtered.slice(0,250);el.innerHTML=`<div class="small muted" style="margin:0 0 9px">총 ${won(filtered.length)}개 · 화면에는 최대 250개 표시</div><div class="table-wrap"><table><thead><tr><th>거래처명</th><th>업종/품목</th><th>지역/주소</th><th>연락처</th><th>사업자 상태</th><th>영업 우선순위</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name||c['거래처명']||c['거래처명(기존)']||'-')}</b></td><td>${esc(c.industry||c['업태']||c['종목_생산품']||c['종목']||'-')}</td><td>${esc(c.address||c['주소']||c['사업장 주소(현재)']||'-')}</td><td>${esc(c.phone||c['전화번호']||'-')}</td><td><span class="pill ${/정상/.test(c.status||c['사업자상태']||'')?'good':'warn'}">${esc(c.status||c['사업자상태']||'미확인')}</span></td><td>${esc(c.priority||'미분류')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">거래처가 없습니다. 상단 “엑셀 가져오기”를 눌러 파일을 불러오세요.</td></tr>'}</tbody></table></div>`}
function pipelineHTML(){return `<div class="card"><div class="toolbar"><input id="pipelineSearch" placeholder="고객·프로젝트·품목 검색" oninput="renderPipelineTable()"><select id="pipelineStage" onchange="renderPipelineTable()"><option value="">모든 단계</option>${['신규','접촉','요구사항 확인','견적 제출','협상','수주','실패'].map(s=>`<option>${s}</option>`).join('')}</select><button class="primary" onclick="openOpportunity()">+ 영업기회 등록</button><button onclick="exportPipeline()">CSV 내보내기</button></div><div id="pipelineTable"></div></div>`}
function pipelineRows(arr){return `<div class="table-wrap"><table><thead><tr><th>고객/프로젝트</th><th>품목</th><th>단계</th><th>예상 금액</th><th>예상 수주일</th><th>다음 행동</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${esc(x.customer||'-')}</b><div class="small muted">${esc(x.project||'')}</div></td><td>${esc(x.product||'-')}</td><td><span class="pill ${x.stage==='수주'?'good':x.stage==='실패'?'warn':''}">${esc(x.stage||'신규')}</span></td><td>${won(x.amount)}원</td><td>${esc(x.closeDate||'-')}</td><td>${esc(x.nextAction||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function renderPipelineTable(){const el=$('#pipelineTable');if(!el)return;const q=($('#pipelineSearch')?.value||'').toLowerCase(),s=$('#pipelineStage')?.value||'';const arr=db.pipeline.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)&&(!s||x.stage===s));el.innerHTML=arr.length?pipelineRows(arr):'<div class="empty">영업기회가 없습니다. 고객별 예상 매출과 다음 행동을 등록해 보세요.</div>'}
function quotesHTML(){return `<div class="two"><div class="card"><div class="section-head"><h2>견적 원가 입력</h2><span class="pill">계산기</span></div><div class="formgrid"><label class="field">품목<input id="qProduct" placeholder="예: GI 코일"></label><label class="field">수량 (톤)<input id="qQty" type="number" min="0" value="10"></label><label class="field">판매 단가 (원/톤)<input id="qSell" type="number" value="1200000"></label><label class="field">구매 원가 (원/톤)<input id="qCost" type="number" value="1050000"></label><label class="field">가공비 (원/톤)<input id="qProcess" type="number" value="30000"></label><label class="field">운송비 (원/톤)<input id="qFreight" type="number" value="15000"></label><label class="field">기타 비용 (원/톤)<input id="qOther" type="number" value="5000"></label><label class="field">목표 GP율 (%)<input id="qTarget" type="number" value="8" step="0.5"></label></div><div class="actions" style="margin-top:15px"><button class="primary" onclick="calcQuote()">마진 계산</button><button onclick="saveQuote()">계산 결과 저장</button></div><div id="quoteResult" class="result"><div class="muted small">판매 단가와 비용을 입력한 뒤 “마진 계산”을 누르세요.</div></div></div><div class="card"><h2 style="font-size:16px;margin-top:0">계산 기준</h2><div class="list"><div class="item"><span class="dot"></span><div><strong>예상 매출</strong><p>판매 단가 × 수량</p></div></div><div class="item"><span class="dot"></span><div><strong>추정 원가</strong><p>(구매 원가 + 가공비 + 운송비 + 기타 비용) × 수량</p></div></div><div class="item"><span class="dot"></span><div><strong>매출총이익률</strong><p>(매출 − 추정 원가) ÷ 매출 × 100</p></div></div></div><div class="notice" style="margin-top:16px">금융비용·재고손실·환율·부가세·결제조건 등 실제 거래에 필요한 항목은 회사 기준에 맞춰 추가해야 합니다. 이 계산은 관리용 추정치이며 자동 가격 승인 기능이 아닙니다.</div></div></div><div class="section card"><div class="section-head"><h2>저장된 견적 계산</h2><button onclick="exportQuotes()">CSV 내보내기</button></div><div class="table-wrap"><table><thead><tr><th>일시</th><th>품목</th><th>수량(t)</th><th>매출</th><th>예상 이익</th><th>GP율</th><th>목표 대비</th></tr></thead><tbody>${db.quotes.slice().reverse().map(q=>`<tr><td>${esc(q.date)}</td><td>${esc(q.product)}</td><td>${won(q.qty)}</td><td>${won(q.revenue)}원</td><td>${won(q.gp)}원</td><td>${q.gpRate.toFixed(2)}%</td><td><span class="pill ${q.gpRate>=q.target?'good':'warn'}">${q.gpRate>=q.target?'목표 충족':'목표 미달'}</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">저장된 계산이 없습니다.</td></tr>'}</tbody></table></div></div>`}
let lastQuote=null;function calcQuote(){const v=id=>Number($('#'+id).value)||0;const qty=v('qQty'),sell=v('qSell'),cost=v('qCost')+v('qProcess')+v('qFreight')+v('qOther'),revenue=qty*sell,totalCost=qty*cost,gp=revenue-totalCost,gpRate=revenue?gp/revenue*100:0,target=v('qTarget');lastQuote={date:new Date().toLocaleString('ko-KR'),product:$('#qProduct').value||'미지정',qty,revenue,totalCost,gp,gpRate,target};$('#quoteResult').innerHTML=`<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><div class="metric-label">예상 매출</div><b>${won(revenue)}원</b></div><div><div class="metric-label">예상 매출총이익</div><b style="color:${gp>=0?'var(--green)':'var(--red)'}">${won(gp)}원</b></div><div><div class="metric-label">추정 원가</div><b>${won(totalCost)}원</b></div><div><div class="metric-label">예상 GP율 / 목표</div><b>${gpRate.toFixed(2)}% / ${target}%</b></div></div><p><span class="pill ${gpRate>=target?'good':'warn'}">${gpRate>=target?'입력한 목표 GP율 충족':'목표 GP율 미달 — 가격/원가 재검토 필요'}</span></p><div class="small muted">단위당 추정 비용 ${won(cost)}원 · 목표 GP율을 맞추기 위한 단순 필요 판매단가 ${won(target<100?cost/(1-target/100):0)}원/톤</div>`}
function saveQuote(){if(!lastQuote){calcQuote()}db.quotes.push(lastQuote);save();render();}
function briefingHTML(){return `<div class="notice">현재 프로토타입에는 실시간 가격·뉴스 피드가 연결되어 있지 않습니다. 아래는 영업 업무에 활용할 브리핑 템플릿이며, 확인되지 않은 시황이나 가격을 실제 정보처럼 생성하지 않습니다.</div><div class="grid section" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card"><div class="metric-label">원재료·제품 가격</div><h3>가격 변동 확인</h3><p class="muted small">열연·냉연·도금·컬러강판·후판의 최신 기준가격, 수입 오퍼, 유통 재고를 출처와 기준일을 붙여 기록합니다.</p></div><div class="card"><div class="metric-label">수요 산업</div><h3>수요 신호 확인</h3><p class="muted small">자동차·건설·조선·산업기계·전력·태양광 프로젝트의 발주와 구매 시점을 고객 기회로 연결합니다.</p></div><div class="card"><div class="metric-label">경쟁·정책</div><h3>영업 영향 평가</h3><p class="muted small">관세·반덤핑·환율·운임·생산 감산 및 경쟁사 판매정책이 고객 견적에 미치는 영향을 평가합니다.</p></div></div><div class="section card"><h2 style="font-size:16px;margin-top:0">브리핑 입력 양식</h2><div class="formgrid"><label class="field">기준일<input id="bDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field">품목/산업<input id="bTopic" placeholder="예: 냉연·GI / 태양광"></label><label class="field">출처 링크<input id="bUrl" placeholder="https://..."></label><label class="field" style="grid-column:1/-1">확인된 내용<textarea id="bFacts" rows="3" placeholder="확인된 가격·수급·정책 변화와 출처를 입력"></textarea></label><label class="field" style="grid-column:1/-1">영업 영향 및 다음 행동<textarea id="bAction" rows="3" placeholder="어떤 고객·품목·견적을 점검할지 입력"></textarea></label></div><div class="actions" style="margin-top:12px"><button class="primary" onclick="saveBriefing()">브리핑 기록 저장</button></div><div id="briefingSaved"></div></div>`}
function saveBriefing(){db.briefings=db.briefings||[];db.briefings.push({date:$('#bDate').value,topic:$('#bTopic').value,url:$('#bUrl').value,facts:$('#bFacts').value,action:$('#bAction').value});save();$('#briefingSaved').innerHTML='<p class="pill good">브리핑 기록을 저장했습니다.</p>'}
function settingsHTML(){return `<div class="two"><div class="card"><h2 style="font-size:16px;margin-top:0">엑셀 파일 가져오기</h2><p class="muted small">거래처 명단 또는 판매 실적 엑셀(.xlsx/.xls)이나 CSV를 선택하세요. 첫 번째 시트의 첫 행을 열 이름으로 읽습니다. 거래처명·전화번호·주소·업태·종목·사업자상태 열을 자동 인식하며, 필요하면 가져온 후 검토해야 합니다.</p><button class="primary" onclick="$('#excelInput').click()">파일 선택</button><div id="importLog" class="result"><div class="small muted">가져오기 결과가 여기에 표시됩니다.</div></div><div class="notice" style="margin-top:12px">파일은 브라우저 안에서 처리됩니다. 현재 버전은 브라우저 로컬 저장소에 데이터를 보관하므로 같은 브라우저/기기에서만 유지됩니다. 다른 기기와 공유하기 전에는 백업 파일을 내보내세요.</div></div><div class="card"><h2 style="font-size:16px;margin-top:0">데이터 백업·관리</h2><div class="list"><div class="item"><span class="dot"></span><div><strong>전체 백업(JSON)</strong><p>현재 거래처·영업기회·견적 데이터를 백업합니다.</p><button onclick="backupJSON()">전체 데이터 백업</button></div></div><div class="item"><span class="dot"></span><div><strong>초기화</strong><p>현재 브라우저에 저장된 데이터를 삭제합니다.</p><button onclick="resetData()">데이터 초기화</button></div></div></div><h3 style="font-size:13px;margin-top:20px">초기 설계 기준</h3><p class="small muted">연 매출 목표 30억원 · 목표 GP율 8% · 신규 고객 20개 · 프로젝트 12건. 이 값은 참고 목표이며 실제 회사 기준에 따라 변경해야 합니다.</p></div></div>`}
function normalizeCustomer(r){const get=(...keys)=>{for(const k of keys)if(r[k]!==undefined&&r[k]!==null&&String(r[k]).trim()!=='')return String(r[k]).trim();return ''};return {name:get('거래처명','거래처명(기존)','상호명','회사명','고객명','업체명','거래처'),industry:get('업태','업종','종목_생산품','종목','품목'),address:get('주소','사업장 주소(현재)','주소지','소재지'),phone:get('전화번호','연락처','대표전화'),status:get('사업자상태','사업자 상태','검증상태','상태')||'미확인',priority:'미분류',...r}}
function importFile(ev){const file=ev.target.files[0];if(!file)return;const log=$('#importLog');const reader=new FileReader();reader.onload=e=>{try{let rows;if(file.name.toLowerCase().endsWith('.csv')){const text=e.target.result;rows=parseCSV(text)}else{if(!window.XLSX)throw new Error('엑셀 판독 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하거나 CSV로 저장해 다시 시도하세요.');const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''})}if(!rows.length)throw new Error('읽을 데이터가 없습니다. 첫 행에 열 이름이 있는지 확인하세요.');const sample=rows[0];const keys=Object.keys(sample);const isCustomer=keys.some(k=>/거래처명|거래처|회사명|업체명|고객명/.test(k));if(isCustomer){const incoming=rows.map(normalizeCustomer).filter(c=>c.name);const seen=new Set(db.customers.map(c=>(c.name||'').replace(/\\s/g,'').toLowerCase()));let added=0;incoming.forEach(c=>{const key=c.name.replace(/\s/g,'').toLowerCase();if(!seen.has(key)){db.customers.push(c);seen.add(key);added++}});save();log.innerHTML=`<b>거래처 가져오기 완료</b><p class="small">읽은 행 ${won(rows.length)}개 · 이름이 있는 행 ${won(incoming.length)}개 · 신규 추가 ${won(added)}개 · 중복으로 건너뜀 ${won(incoming.length-added)}개</p><p class="small muted">이름 기준 중복만 단순 비교했습니다. 상호 변경·폐업·사업자 상태는 자동 확정하지 않습니다.</p>`}else{const mapped=rows.map(r=>({customer:r['거래처명']||r['고객명']||r['고객']||r['업체명']||'',product:r['품목']||r['제품']||r['제품명']||'',amount:Number(r['매출액']||r['매출']||r['금액']||0),stage:'수주',closeDate:r['일자']||r['매출일']||'',nextAction:'실적 데이터 확인'})).filter(x=>x.customer||x.amount);if(mapped.length){db.salesImported=(db.salesImported||[]).concat(mapped);save();log.innerHTML=`<b>판매 자료 읽기 완료</b><p class="small">${won(mapped.length)}행을 판매 자료 임시 저장소에 보관했습니다. 이 초기 버전은 판매 실적 파일의 열 이름을 회사 형식에 맞춰 매핑하는 후속 작업이 필요합니다.</p>`}else log.innerHTML=`<b>파일은 읽었으나 자동 분류하지 못했습니다.</b><p class="small">첫 행 열 이름: ${esc(keys.slice(0,20).join(', '))}</p><p class="small">거래처명 또는 판매 실적 열 이름을 확인해 주세요.</p>`}render();}catch(err){if(log)log.innerHTML=`<span style="color:var(--red)">가져오기 실패: ${esc(err.message)}</span>`;else alert(err.message)} };if(file.name.toLowerCase().endsWith('.csv'))reader.readAsText(file,'utf-8');else reader.readAsArrayBuffer(file);ev.target.value=''}
function parseCSV(s){const lines=s.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const parseLine=line=>{let a=[],v='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&q&&line[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a};const h=parseLine(lines[0]);return lines.slice(1).map(line=>{const vals=parseLine(line),o={};h.forEach((k,i)=>o[k]=vals[i]||'');return o})}
function openOpportunity(){modal(`<h2>영업기회 등록</h2><form id="oppForm"><div class="formgrid"><label class="field">고객명<input name="customer" required placeholder="거래처명"></label><label class="field">프로젝트/용도<input name="project" placeholder="예: 태양광 구조물"></label><label class="field">품목<input name="product" placeholder="예: GI / 컬러강판"></label><label class="field">예상 금액(원)<input name="amount" type="number" min="0" value="0"></label><label class="field">진행 단계<select name="stage">${['신규','접촉','요구사항 확인','견적 제출','협상','수주','실패'].map(s=>`<option>${s}</option>`).join('')}</select></label><label class="field">예상 수주일<input name="closeDate" type="date"></label><label class="field" style="grid-column:1/-1">다음 행동<input name="nextAction" placeholder="예: 도면 수령 후 견적 제출"></label></div><div class="modal-actions"><button type="button" onclick="closeModal()">취소</button><button class="primary" type="submit">저장</button></div></form>`);$('#oppForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.amount=Number(x.amount)||0;db.pipeline.push(x);save();closeModal();render()}}
function openCustomer(){modal(`<h2>거래처 등록</h2><form id="custForm"><div class="formgrid"><label class="field">거래처명<input name="name" required></label><label class="field">업종/품목<input name="industry"></label><label class="field">전화번호<input name="phone"></label><label class="field" style="grid-column:1/-1">주소<input name="address"></label><label class="field">사업자 상태<select name="status"><option>미확인</option><option>정상</option><option>확인 필요</option></select></label><label class="field">영업 우선순위<select name="priority"><option>미분류</option><option>A</option><option>B</option><option>C</option></select></label></div><div class="modal-actions"><button type="button" onclick="closeModal()">취소</button><button class="primary">저장</button></div></form>`);$('#custForm').onsubmit=e=>{e.preventDefault();db.customers.push(Object.fromEntries(new FormData(e.target)));save();closeModal();render()}}
function modal(inner){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><span class="pill">새 기록</span><button onclick="closeModal()">닫기 ✕</button></div>${inner}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function csvDownload(filename,rows){if(!rows.length){alert('내보낼 데이터가 없습니다.');return}const keys=[...new Set(rows.flatMap(Object.keys))];const csv='\uFEFF'+[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=filename;a.click();URL.revokeObjectURL(a.href)}function exportCustomers(){csvDownload('steel_customers.csv',db.customers)}function exportPipeline(){csvDownload('steel_pipeline.csv',db.pipeline)}function exportQuotes(){csvDownload('steel_quotes.csv',db.quotes)}function backupJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='steel_sales_ai_backup.json';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('이 브라우저에 저장된 거래처·영업기회·견적 기록을 모두 삭제할까요? 백업이 없다면 복구할 수 없습니다.')){localStorage.removeItem('steelSalesAI');db=JSON.parse(JSON.stringify(seed));render()}}
